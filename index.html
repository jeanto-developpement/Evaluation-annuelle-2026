<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Évaluation annuelle – Flo-Fab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F5F7F9; --sheet:#FFFFFF; --ink:#1C2630; --muted:#5B6873;
  --line:#D5DCE2; --steel:#0E4F8B; --steel-soft:#E3EDF7; --signal:#E8A317; --signal-soft:#FDF3DC; --alert:#B8431F; --ok:#2E7D4F;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11171D; --sheet:#1A222A; --ink:#E6ECF1; --muted:#9AA8B4;
    --line:#2F3B46; --steel:#6FA8DE; --steel-soft:#1E3247; --signal:#F0B84A; --signal-soft:#3A2F17; --alert:#E07A56; --ok:#6CC08F;
  }
}
:root[data-theme="dark"]{
  --paper:#11171D; --sheet:#1A222A; --ink:#E6ECF1; --muted:#9AA8B4;
  --line:#2F3B46; --steel:#6FA8DE; --steel-soft:#1E3247; --signal:#F0B84A; --signal-soft:#3A2F17; --alert:#E07A56; --ok:#6CC08F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 64px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1.1;margin:0}
header.top{border-left:6px solid var(--steel);padding:8px 0 8px 18px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap-reverse}
header.top h1{font-size:clamp(2rem,5vw,3rem)}
header.top p{margin:4px 0 0;color:var(--muted);font-size:1.05rem}
.logo{height:72px;width:auto;max-width:100%;flex-shrink:0}
.role{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:3px;background:var(--steel-soft);color:var(--steel);font-weight:600;font-size:.9rem}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:20px}
.ident{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem;color:var(--muted)}
.ro{font-weight:600;color:var(--ink);font-size:1rem}
input[type=text],input[type=email],input[type=date],input[type=password],select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.intro p{margin:0 0 10px;max-width:72ch}
.intro ol{margin:10px 0 0;padding-left:20px;max-width:72ch}
.intro li{margin-bottom:6px}
.legend{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;font-size:.8rem;line-height:1.25}
.legend div{display:flex;gap:6px;align-items:flex-start}
.legend b{font-family:"Barlow Condensed",sans-serif;font-size:1.3rem;line-height:1;color:var(--steel)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:32px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.section-h h2{font-size:1.7rem}
.section-h span{color:var(--muted);font-size:.9rem;white-space:nowrap}
.item{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:44px 1fr;gap:4px 14px}
.item.missing{border-color:var(--alert);box-shadow:inset 4px 0 0 var(--alert)}
.num{font-family:"Barlow Condensed",sans-serif;font-size:1.9rem;font-weight:700;color:var(--steel);line-height:1}
.item h3{font-size:1.3rem}
.item .desc{margin:4px 0 12px;color:var(--muted);max-width:70ch}
.body{grid-column:2}
.rate{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.rate .who{width:110px;font-weight:600;font-size:.9rem}
.seg{display:flex;gap:6px}
.seg button{width:44px;height:40px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:4px;font:600 1rem "Barlow",sans-serif;cursor:pointer}
.seg button:hover:not(:disabled){border-color:var(--steel)}
.seg button:disabled{cursor:default;opacity:.55}
.seg button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:#fff;opacity:1}
.rate.sup .seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.gap{margin-top:8px;font-size:.88rem;padding:6px 10px;border-radius:4px;display:none}
.gap.show{display:block;background:var(--signal-soft);border-left:4px solid var(--signal)}
.ecom{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--steel);background:var(--steel-soft);font-size:.92rem;white-space:pre-wrap}
.ecom b{display:block;font-size:.8rem;color:var(--muted)}
.item details{margin-top:10px}
.item summary{cursor:pointer;color:var(--steel);font-weight:600;font-size:.92rem}
.item details textarea{margin-top:8px}
.summary table{width:100%;border-collapse:collapse;font-size:.95rem}
.tscroll{overflow-x:auto}
.summary th,.summary td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.summary th{font-family:"Barlow Condensed",sans-serif;font-size:1.05rem}
.summary .n{text-align:right;font-variant-numeric:tabular-nums}
.summary tr.total td{font-weight:700;border-top:2px solid var(--ink)}
.bigs{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:16px}
.bigs div{display:flex;flex-direction:column}
.bigs strong{font-family:"Barlow Condensed",sans-serif;font-size:2.4rem;line-height:1}
.bigs span{color:var(--muted);font-size:.88rem}
.watch{margin-top:14px;color:var(--alert);font-weight:600}
.open h3{font-size:1.25rem;margin-bottom:8px}
.open textarea{min-height:120px;margin-bottom:18px}
.answer{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:18px;min-height:44px}
.sigwrap h3{font-size:1.25rem;margin-bottom:8px}
.pad.invalid{outline:2px solid var(--alert);border-color:var(--alert)}
.pad{position:relative;border:1.5px dashed var(--muted);border-radius:6px;background:#fff;height:170px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block;border-radius:6px;cursor:crosshair}
.pad .hint{position:absolute;left:14px;bottom:10px;color:#8A96A0;font-size:.85rem;pointer-events:none}
.sigrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.sigrow label.f{min-width:180px}
.attest{display:flex;gap:10px;align-items:flex-start;margin-top:14px;max-width:72ch;font-size:.95rem}
.attest input{margin-top:4px;width:18px;height:18px;flex-shrink:0}
.signed{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.signed img{height:80px;background:#fff;border:1px solid var(--line);border-radius:4px;grid-row:span 3}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:min(560px,92vw);background:var(--alert);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none}
.toast.show{display:block}
.invalid{border-color:var(--alert)!important;outline:2px solid var(--alert)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}
.tog .who2{display:flex;flex-direction:column}
.tog .who2 small{color:var(--muted)}
.tog.off .who2{opacity:.55}
.sw{position:relative;width:52px;height:30px;flex-shrink:0}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:30px;transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(22px)}
.sw input:focus-visible+span{outline:3px solid var(--signal);outline-offset:2px}
.lienbox{margin:14px 0;padding:14px;border:1px dashed var(--steel);border-radius:6px;background:var(--steel-soft)}
.lienbox input{font-size:.85rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;align-items:center}
.btn{font:600 1rem "Barlow",sans-serif;padding:12px 20px;border-radius:4px;cursor:pointer;border:1.5px solid var(--steel);background:var(--steel);color:#fff}
.btn.ghost{background:transparent;color:var(--steel);padding:8px 14px;font-size:.92rem}
.btn:disabled{opacity:.6;cursor:wait}
.status{font-weight:600}
.status.err{color:var(--alert)}
.status.ok{color:var(--ok)}
.banner{padding:12px 16px;border-radius:6px;margin-bottom:20px;border-left:5px solid var(--alert);background:var(--signal-soft)}
.done{text-align:left;padding:32px 24px}
.done h2{font-size:2rem;margin-bottom:10px;color:var(--ok)}
.done p{max-width:62ch}
@media (max-width:640px){
  .logo{height:52px}
  .legend{grid-template-columns:1fr 1fr;font-size:.75rem}
  .legend div:last-child{grid-column:span 2}
  .item{grid-template-columns:1fr}
  .body{grid-column:1}
  .rate .who{width:100%}
  .seg{flex:1}
  .seg button{width:auto;flex:1;min-width:40px}
}
@media print{
  :root{--paper:#fff;--sheet:#fff;--ink:#000;--muted:#333;--line:#999}
  body{font-size:11pt}
  .legend{position:static}
  .actions,.btn{display:none}
  .item{break-inside:avoid}
}
</style>
</head>

<script src="config.js"></script>
<script>
/* La configuration se trouve dans config.js (adresse du service Google, année). */
const DEFAUTS = {
  API_URL: "https://script.google.com/macros/s/VOTRE_ID_DE_DEPLOIEMENT/exec",
  ANNEE_DEFAUT: "2026",
  POSTES: ["Assembleur pompe", "Assembleur système", "Soudeur", "Journalier", "Peintre", "M.O.I."]
};
const FC = window.FLOFAB_CONFIG || {};
const CONFIG = Object.assign({}, DEFAUTS, FC);
if (!FC.API_URL || /VOTRE_ID/.test(FC.API_URL)) CONFIG.API_URL = DEFAUTS.API_URL; // ne jamais remplacer une adresse valide par l'exemple

const SECTIONS=[
 {t:"Performance",items:[
  ["Temps d'exécution des tâches","Selon le temps alloué : 1 = 25 % de plus que le temps alloué, 5 = 25 % en bas du temps alloué."],
  ["Qualité et précision du travail","Pas d'erreurs et n'occasionne pas de reprises (redo); travail précis et constant, inspection finale complète."],
  ["Bon de travail","Bon de travail propre, bien rempli, aucun item manquant."],
  ["Suivi des procédures","Connaît et comprend les procédures, les règles et les façons de faire de l'entreprise."],
  ["Recherche l'information","Recherche de l'aide rapidement si nécessaire afin d'être efficace et de sauver du temps."],
  ["Retard et ponctualité","Respect des horaires : matin, pause, dîner, soir."],
  ["Jours d'absence au travail","S'absente occasionnellement pour des motifs raisonnables. Conserve une bonne moyenne d'heures travaillées annuellement."],
  ["Disponibilité","Est disponible pour travailler les soirs, les fins de semaine ou en temps supplémentaire selon les besoins de la production."]
 ]},
 {t:"Savoir-faire",items:[
  ["Autonomie et compréhension rapide","Exécute ses tâches sans supervision, a la capacité de prendre des initiatives et va au-devant des problèmes. Lorsqu'une question est posée et répondue, elle ne l'est pas plusieurs fois."],
  ["Débrouillardise","Trouve des solutions aux problèmes avant d'abandonner ou de demander de l'aide (système D)."],
  ["Organisation et planification","A une vue d'ensemble du travail à exécuter, priorise et organise ses tâches de façon efficace."],
  ["Polyvalence","Possède toutes les habiletés pour accomplir toutes les tâches de son département, et plus."],
  ["Ordre et propreté","Replace les outils aux bons endroits, maintient son environnement de travail propre, en ordre et efficace. Son ouvrage est propre une fois terminé."]
 ]},
 {t:"Participation au succès de l'entreprise",items:[
  ["Partage des connaissances et entraide","Partage son savoir-faire et aide ses collègues et ses supérieurs."],
  ["Idées et amélioration","Apporte des idées d'amélioration et des solutions afin d'améliorer la condition et l'efficacité du travail."]
 ]},
 {t:"Travail d'équipe et participation au succès de l'entreprise",items:[
  ["Santé et sécurité","Est proactif vis-à-vis la sécurité des processus, des procédés et de ses collègues. Prend les moyens pour éviter ses blessures et celles de ses collègues."],
  ["Leadership","Est considéré comme une personne-ressource par ses collègues et ses supérieurs."],
  ["Attitude et engagement","Attitude positive et constructive, respect, langage approprié, tenue vestimentaire; participe activement aux rencontres et à l'amélioration."]
 ]}
];
const IDS=[];SECTIONS.forEach(s=>s.items.forEach(()=>IDS.push("c"+(IDS.length+1))));

const P=new URLSearchParams(location.search);
const EID=P.get("id"),TOK=P.get("t"),ADM=P.get("a"),KEY=P.get("admin");
const MODE=(EID&&TOK)?"sup":"emp";
const ME=MODE; // rôle qui cote sur cette page
const LS_KEY=MODE==="emp"?"flofab-eval-emp-v2":"flofab-eval-sup-v2-"+EID;
const app=document.getElementById("app");
let state={r:{},t:{}};
let EVAL=null; // données de l'employé (mode évaluateur)
let pad=null;

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function loadDraft(){try{const s=localStorage.getItem(LS_KEY);if(s)state=Object.assign({r:{},t:{}},JSON.parse(s));}catch(e){}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function clearDraft(){try{localStorage.removeItem(LS_KEY);}catch(e){}}
const apiReady=()=>!/VOTRE_ID/.test(CONFIG.API_URL);

const MSG_SERVICE="Le service Google ne répond pas correctement. Vérifiez dans config.js que l'adresse se termine bien par /exec et est complète, et que le déploiement Apps Script est en accès « Tout le monde » (nouvelle version publiée après chaque modification du script).";
const MSG_KIND={
  net:"Le navigateur n'a pas pu joindre le service Google. Causes probables : le déploiement Apps Script n'est pas en accès « Tout le monde » (l'accès limité à l'organisation ne fonctionne pas depuis GitHub), l'adresse /exec est fausse ou incomplète, ou un blocage réseau.",
  html:"Google a répondu par une page (connexion demandée, adresse incorrecte ou erreur du script) au lieu de données. Vérifiez l'adresse /exec et l'accès « Tout le monde ».",
  old:"Le service répond, mais c'est une ancienne version du script. Dans Apps Script : Déployer › Gérer les déploiements › crayon › Nouvelle version › Déployer."
};
function svcError(kind,extra){const e=new Error(MSG_KIND[kind]||MSG_SERVICE);e.kind=kind;e.extra=extra;return e;}
async function apiCall(url,opts){
  let r,txt;
  try{r=await fetch(url,opts);txt=await r.text();}
  catch(e){throw svcError("net");}
  let j;
  try{j=JSON.parse(txt);}
  catch(e){throw svcError("html");}
  return j;
}
const apiGet=params=>apiCall(CONFIG.API_URL+"?"+new URLSearchParams(params));
const apiPost=body=>apiCall(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});

/* ---------- Construction de la page ---------- */
function legendHtml(){
  return `<div class="legend" aria-label="Échelle d'évaluation">
   <div><b>1</b>Ne répond pas aux attentes</div><div><b>2</b>Répond à certaines attentes, besoin d'amélioration</div>
   <div><b>3</b>Répond aux attentes</div><div><b>4</b>Surpasse parfois les attentes</div><div><b>5</b>Surpasse de loin les attentes</div></div>`;
}
function introHtml(){
  if(MODE==="sup") return `<section class="sheet intro"><p>L'employé a complété son autoévaluation. Ses cotes sont affichées en bleu à titre de référence. Attribuez votre propre cote pour chaque critère, ajoutez vos commentaires, puis signez. Le rapport final combiné sera envoyé automatiquement par courriel aux administrateurs.</p></section>`;
  return `<section class="sheet intro">
    <p>Vous êtes invité à procéder à votre autoévaluation à l'aide de la grille ci-dessous. Que pensez-vous de vous-même? De vos forces et de vos faiblesses? Sont-elles les mêmes que l'année dernière? Avez-vous démontré des efforts? Du progrès?</p>
    <p>Votre évaluateur procédera également à votre évaluation avec la même grille, puis vous comparerez ensemble vos appréciations lors de la rencontre.</p>
    <p><strong>Évaluez soigneusement chacune des qualités et compétences séparément.</strong></p>
    <ol><li>L'objectif est de faire ressortir vos points forts et de discuter de vos points à améliorer.</li>
    <li>Soyez objectif : évitez de tout évaluer comme « moyen », montrez-vous plus critique.</li>
    <li>Choisissez la cote de 1 à 5 qui vous décrit le mieux.</li></ol></section>`;
}
function identHtml(){
  if(MODE==="sup"){
    const i=EVAL.identite;
    return `<section class="sheet"><div class="ident">
     <div class="f"><label class="f">Employé</label><span class="ro">${esc(i.nom)}</span></div>
     <div class="f"><label class="f">Poste</label><span class="ro">${esc(i.poste)}</span></div>
     <div class="f"><label class="f">Année évaluée</label><span class="ro">${esc(i.annee)}</span></div>
     <div class="f"><label class="f">Évaluateur</label><span class="ro">${esc(i.evaluateur)}</span></div></div></section>`;
  }
  return `<section class="sheet"><div class="ident">
    <label class="f">Nom complet *<input type="text" data-k="nom" autocomplete="name" required></label>
    <label class="f">Poste *<select data-k="poste" required><option value="">Choisir…</option>${CONFIG.POSTES.map(p=>`<option>${esc(p)}</option>`).join("")}</select></label>
    <label class="f">Année évaluée<input type="text" data-k="annee" value="${CONFIG.ANNEE_DEFAUT}"></label>
  </div></section>`;
}
function seg(who,id,title,val,disabled){
  const lbl=who==="emp"?(MODE==="emp"?"Votre cote":"Employé"):"Évaluateur";
  return `<div class="rate ${who}"><span class="who">${lbl}</span><div class="seg" role="group" aria-label="${esc(title)} – ${lbl}">${[1,2,3,4,5].map(v=>`<button type="button" data-who="${who}" data-v="${v}" aria-pressed="${val===v}" ${disabled?"disabled":""}>${v}</button>`).join("")}</div></div>`;
}
function gridHtml(){
  let h="",n=0;
  SECTIONS.forEach(s=>{
    h+=`<div class="section-h"><h2>${esc(s.t)}</h2><span>Critères ${n+1} à ${n+s.items.length}</span></div>`;
    s.items.forEach(([title,desc])=>{
      n++;const id="c"+n;
      let rows,extra="";
      if(MODE==="emp"){
        rows=seg("emp",id,title,null,false);
        extra=`<details><summary>Commentaires, points à améliorer, objectifs</summary><textarea data-k="com-${id}" aria-label="Commentaires – ${esc(title)}"></textarea></details>`;
      }else{
        const ev=EVAL.notes[id],ec=EVAL.commentaires[id];
        rows=seg("emp",id,title,ev,true)+seg("sup",id,title,null,false);
        if(ec) extra+=`<div class="ecom"><b>Commentaire de l'employé</b>${esc(ec)}</div>`;
        extra+=`<div class="gap" id="gap-${id}"></div><details><summary>Commentaires de l'évaluateur, points à améliorer, objectifs</summary><textarea data-k="com-${id}" aria-label="Commentaires de l'évaluateur – ${esc(title)}"></textarea></details>`;
      }
      h+=`<article class="item" data-id="${id}"><div class="num">${n}</div><div class="body"><h3>${esc(title)}</h3><p class="desc">${esc(desc)}</p>${rows}${extra}</div></article>`;
    });
  });
  return `<div id="grid">${h}</div>`;
}
function openHtml(){
  if(MODE==="sup"){
    const r=EVAL.reponses||{};
    return `<section class="sheet open">
      <h3>Qu'est-ce que j'ai accompli et amélioré durant la dernière année? <small>(employé)</small></h3><div class="answer">${esc(r.accompli)||"—"}</div>
      <h3>Qu'est-ce que je veux accomplir et améliorer dans la prochaine année? <small>(employé)</small></h3><div class="answer">${esc(r.prochaine)||"—"}</div>
      <h3>Autres commentaires de l'employé</h3><div class="answer">${esc(r.autres)||"—"}</div>
      <h3>Commentaires de l'évaluateur et objectifs convenus pour la prochaine année</h3><textarea data-k="commentaires"></textarea></section>`;
  }
  return `<section class="sheet open">
    <h3>Qu'est-ce que j'ai accompli et amélioré durant la dernière année?</h3><textarea data-k="accompli"></textarea>
    <h3>Qu'est-ce que je veux accomplir et améliorer dans la prochaine année?</h3><textarea data-k="prochaine"></textarea>
    <h3>Autres commentaires, objectifs, etc.</h3><textarea data-k="autres"></textarea></section>`;
}
function signHtml(){
  let prev="";
  if(MODE==="sup"){
    prev=`<div class="signed"><img src="${esc(EVAL.signature)}" alt="Signature de l'employé">
      <strong>Signé par l'employé : ${esc(EVAL.identite.nom)}</strong><span>Date : ${esc(EVAL.date_signature)}</span><span style="color:var(--muted);font-size:.85rem">Horodatage : ${esc(EVAL.horodatage)}</span></div>`;
  }
  const who=MODE==="emp"?"de l'employé":"de l'évaluateur";
  return `<section class="sheet sigwrap">${prev}
    <h3>Signature ${who}</h3>
    <div class="pad" id="pad"><canvas id="sig" aria-label="Zone de signature"></canvas><span class="hint" id="hint">Signez ici avec le doigt, le stylet ou la souris</span></div>
    <div class="sigrow">
      <button type="button" class="btn ghost" id="clearSig">Effacer la signature</button>
      <label class="f">Date *<input type="date" id="sigDate" value="${today()}"></label>
    </div>
    <label class="attest"><input type="checkbox" id="attest"><span>Je confirme que les renseignements fournis sont exacts et j'accepte que cette signature électronique ait la même valeur que ma signature manuscrite.</span></label>
  </section>`;
}
function build(){
  app.innerHTML=(apiReady()?"":`<div class="banner">Configuration incomplète : l'adresse du service Google Apps Script n'est pas encore inscrite dans CONFIG.API_URL. Les envois ne fonctionneront pas.</div>`)
   +identHtml()+introHtml()+legendHtml()+gridHtml()
   +`<div class="section-h"><h2>Bilan des cotes</h2><span>Calculé automatiquement</span></div><section class="sheet summary" id="summary"></section>`
   +`<div class="section-h"><h2>Réflexion et objectifs</h2></div>`+openHtml()
   +`<div class="section-h"><h2>Signature</h2></div>`+signHtml()
   +`<div class="actions"><button class="btn" type="button" id="send">${MODE==="emp"?"Signer et envoyer mon autoévaluation":"Signer et envoyer le rapport final"}</button><span class="status" id="status" aria-live="polite"></span></div>`;
  bind();paint();
  pad=new SigPad(document.getElementById("sig"),document.getElementById("hint"));
  document.getElementById("clearSig").onclick=()=>pad.clear();
  document.getElementById("send").onclick=submit;
}

/* ---------- Interactions ---------- */
function bind(){
  document.getElementById("grid").addEventListener("click",e=>{
    const b=e.target.closest(".seg button");if(!b||b.disabled)return;
    const id=b.closest(".item").dataset.id,v=+b.dataset.v;
    state.r[id]=state.r[id]===v?null:v;
    b.closest(".item").classList.remove("missing");
    save();paint();
  });
  document.querySelectorAll("[data-k]").forEach(inp=>{
    const k=inp.dataset.k;
    if(state.t[k]!=null&&inp.tagName!=="SELECT")inp.value=state.t[k];
    inp.addEventListener("input",()=>{state.t[k]=inp.value;save();if(k==="annee")document.getElementById("yr").textContent=inp.value;});
    inp.addEventListener("change",()=>{state.t[k]=inp.value;save();});
  });
  const p=document.querySelector('select[data-k="poste"]');if(p&&state.t.poste)p.value=state.t.poste;
  document.querySelectorAll("details").forEach(d=>{const t=d.querySelector("textarea");if(t&&t.value)d.open=true;});
}
const avg=a=>{a=a.filter(x=>x);return a.length?a.reduce((p,c)=>p+c,0)/a.length:null};
const f=x=>x==null?"—":x.toFixed(1).replace(".",",");
function empVal(id){return MODE==="emp"?state.r[id]:EVAL.notes[id];}
function supVal(id){return MODE==="sup"?state.r[id]:null;}
function paint(){
  document.querySelectorAll(".item").forEach(el=>{
    const id=el.dataset.id;
    el.querySelectorAll(`.rate.${ME} .seg button`).forEach(b=>b.setAttribute("aria-pressed",state.r[id]===+b.dataset.v));
    if(MODE==="sup"){
      const e=empVal(id),s=supVal(id),g=document.getElementById("gap-"+id);
      if(e&&s&&Math.abs(e-s)>=2){g.className="gap show";g.textContent=`Écart de ${Math.abs(e-s)} points entre les deux cotes — à discuter lors de la rencontre.`;}
      else{g.className="gap";g.textContent="";}
    }
  });
  let rows="",allE=[],allS=[],k=0,watch=[];
  SECTIONS.forEach(s=>{
    const e=[],su=[];
    s.items.forEach(([title])=>{k++;const id="c"+k;e.push(empVal(id));su.push(supVal(id));
      if(MODE==="sup"&&empVal(id)&&supVal(id)&&Math.abs(empVal(id)-supVal(id))>=2)watch.push(k+". "+title);});
    allE.push(...e);allS.push(...su);
    rows+=`<tr><td>${esc(s.t)}</td><td class="n">${f(avg(e))}</td>${MODE==="sup"?`<td class="n">${f(avg(su))}</td>`:""}</tr>`;
  });
  const tot=IDS.length,dE=allE.filter(x=>x).length,dS=allS.filter(x=>x).length;
  document.getElementById("summary").innerHTML=
   `<div class="bigs"><div><strong>${f(avg(allE))}</strong><span>Moyenne employé (${dE}/${tot})</span></div>${MODE==="sup"?`<div><strong>${f(avg(allS))}</strong><span>Moyenne évaluateur (${dS}/${tot})</span></div>`:""}</div>
   <div class="tscroll"><table><thead><tr><th>Section</th><th class="n">Employé</th>${MODE==="sup"?'<th class="n">Évaluateur</th>':""}</tr></thead><tbody>${rows}
   <tr class="total"><td>Global</td><td class="n">${f(avg(allE))}</td>${MODE==="sup"?`<td class="n">${f(avg(allS))}</td>`:""}</tr></tbody></table></div>
   ${watch.length?`<p class="watch">Critères avec un écart de 2 points ou plus : ${esc(watch.join(", "))}</p>`:""}`;
}

/* ---------- Signature ---------- */
function SigPad(canvas,hint){
  const ctx=canvas.getContext("2d");let drawing=false,empty=true,last=null;
  const size=()=>{if(!empty)return;const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.scale(d,d);ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0B2545";};
  size();window.addEventListener("resize",size);
  const pos=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  canvas.addEventListener("pointerdown",e=>{e.preventDefault();document.getElementById("pad").classList.remove("invalid");try{canvas.setPointerCapture(e.pointerId);}catch(_){}drawing=true;last=pos(e);ctx.beginPath();ctx.arc(last.x,last.y,1.1,0,Math.PI*2);ctx.fillStyle="#0B2545";ctx.fill();if(empty){empty=false;hint.style.display="none";}});
  canvas.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>canvas.addEventListener(ev,()=>drawing=false));
  this.clear=()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.restore();empty=true;hint.style.display="";size();};
  this.isEmpty=()=>empty;
  this.toData=()=>{const c=document.createElement("canvas"),w=600,h=Math.round(600*canvas.height/canvas.width);c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(canvas,0,0,w,h);return c.toDataURL("image/png");};
}

/* ---------- Envoi ---------- */
let toastTimer=null;
function setStatus(msg,cls){
  const s=document.getElementById("status");if(s){s.textContent=msg;s.className="status "+(cls||"");}
  const tt=document.getElementById("toast");
  if(tt){clearTimeout(toastTimer);if(cls==="err"&&msg){tt.textContent=msg;tt.classList.add("show");toastTimer=setTimeout(()=>tt.classList.remove("show"),9000);}else tt.classList.remove("show");}
}
function flag(el,msg){
  document.querySelectorAll(".invalid").forEach(x=>x.classList.remove("invalid"));
  if(el){el.classList.add("invalid");el.scrollIntoView({behavior:"smooth",block:"center"});if(el.focus&&el.tagName!=="DIV")try{el.focus({preventScroll:true});}catch(_){}
    el.addEventListener("input",()=>el.classList.remove("invalid"),{once:true});el.addEventListener("change",()=>el.classList.remove("invalid"),{once:true});}
  setStatus(msg,"err");
}
function checkRatings(){
  const miss=IDS.filter(id=>!state.r[id]);
  document.querySelectorAll(".item").forEach(el=>el.classList.toggle("missing",miss.includes(el.dataset.id)));
  if(miss.length){document.querySelector(`.item[data-id="${miss[0]}"]`).scrollIntoView({behavior:"smooth",block:"center"});}
  return miss.length;
}
function collectComments(){const o={};IDS.forEach(id=>{const v=(state.t["com-"+id]||"").trim();if(v)o[id]=v;});return o;}
async function submit(){
  if(!apiReady()){setStatus("Envoi impossible : le service n'est pas configuré (adresse manquante dans config.js).","err");return;}
  let body;
  if(MODE==="emp"){
    const t=state.t;
    if(!(t.nom||"").trim()){flag(document.querySelector('[data-k="nom"]'),"Écrivez votre nom complet en haut du formulaire.");return;}
    if(!t.poste){flag(document.querySelector('[data-k="poste"]'),"Choisissez votre poste en haut du formulaire.");return;}
  }
  const missing=checkRatings();
  if(missing){setStatus(`Il manque ${missing} cote${missing>1?"s":""} (encadrée${missing>1?"s":""} en rouge).`,"err");return;}
  if(MODE==="emp"){
    const t=state.t;
    body={action:"soumettreEmploye",
      identite:{nom:t.nom.trim(),poste:t.poste,annee:(t.annee||CONFIG.ANNEE_DEFAUT).trim()},
      notes:Object.fromEntries(IDS.map(id=>[id,state.r[id]])),commentaires:collectComments(),
      reponses:{accompli:t.accompli||"",prochaine:t.prochaine||"",autres:t.autres||""}};
  }else{
    body={action:"soumettreEvaluateur",id:EID,jeton:TOK,
      notes:Object.fromEntries(IDS.map(id=>[id,state.r[id]])),commentaires:collectComments(),
      reponses:{commentaires:state.t.commentaires||""}};
  }
  const date=document.getElementById("sigDate").value;
  if(pad.isEmpty()){flag(document.getElementById("pad"),"Ajoutez votre signature dans la zone prévue (doigt, stylet ou souris).");return;}
  if(!date){flag(document.getElementById("sigDate"),"Indiquez la date de signature.");return;}
  if(!document.getElementById("attest").checked){flag(document.getElementById("attest"),"Cochez la case de confirmation sous la signature.");return;}
  body.signature={image:pad.toData(),date};
  const btn=document.getElementById("send");btn.disabled=true;setStatus("Envoi en cours…");
  try{
    const res=await apiPost(body);
    if(!res.ok)throw new Error(res.erreur||"Erreur inconnue.");
    clearDraft();
    app.innerHTML=MODE==="emp"
     ?`<section class="sheet done"><h2>Autoévaluation envoyée</h2><p>Merci. Votre autoévaluation a été envoyée. Les administrateurs ont été avisés et désigneront l'évaluateur, qui la comparera avec vous lors de la rencontre.</p></section>`
     :`<section class="sheet done"><h2>Rapport final envoyé</h2><p>Le rapport combiné (autoévaluation et évaluation de l'évaluateur) a été envoyé en PDF par courriel aux administrateurs.</p></section>`;
    window.scrollTo({top:0});
  }catch(err){
    setStatus("L'envoi a échoué : "+err.message,"err");btn.disabled=false;
  }
}

/* ---------- Démarrage ---------- */

/* ---------- Panneau : gérer les destinataires ---------- */
async function initGestion(){
  document.getElementById("roleTag").textContent="Gestion des destinataires";
  if(!apiReady()){app.innerHTML=`<div class="banner">Le service n'est pas configuré (CONFIG.API_URL).</div>`;return;}
  let res;
  try{
    res=await apiGet({action:"gestion",cle:KEY});
    if(!res.ok)throw new Error(res.erreur);
  }catch(err){app.innerHTML=`<div class="banner">Accès refusé : ${esc(err.message)}</div>`;return;}
  const row=(role,courriel,titre,actif)=>`<div class="tog${actif?"":" off"}"><div class="who2"><strong>${esc(titre)}</strong>${titre!==courriel?`<small>${esc(courriel)}</small>`:""}</div><label class="sw"><input type="checkbox" role="switch" data-role="${role}" data-c="${esc(courriel)}" aria-label="${esc(titre)}" ${actif?"checked":""}><span></span></label></div>`;
  app.innerHTML=`<section class="sheet intro"><p>Activez ou désactivez les personnes qui reçoivent des courriels. Les changements sont enregistrés immédiatement.</p>
    <p><strong>Administrateur désactivé</strong> : ne reçoit plus les liens d'assignation, les avis ni la copie du rapport final.<br><strong>Évaluateur désactivé</strong> : n'apparaît plus dans la liste de désignation. Une évaluation déjà assignée à cette personne reste valide.</p></section>
    <div class="section-h"><h2>Administrateurs</h2><span>Reçoivent les assignations et les copies</span></div>
    <section class="sheet" id="lAdm">${res.administrateurs.map(a=>row("admin",a.courriel,a.courriel,a.actif)).join("")}</section>
    <div class="section-h"><h2>Évaluateurs</h2><span>Proposés lors de la désignation</span></div>
    <section class="sheet" id="lEv">${res.evaluateurs.map(a=>row("eval",a.courriel,a.nom,a.actif)).join("")}</section>
    <div class="section-h"><h2>État du service</h2><span>Vérification en direct</span></div>
    <section class="sheet" id="etat"><p style="margin:0;color:var(--muted)">Vérification…</p></section>
    <div class="actions"><button class="btn" type="button" id="testMail">Envoyer un courriel de test aux administrateurs</button><span class="status" id="status" aria-live="polite"></span></div>`;
  apiGet({action:"diagnostic"}).then(d=>{
    const li=(okv,txt)=>`<div class="tog"><span>${esc(txt)}</span><strong style="color:var(${okv?"--ok":"--alert"})">${okv?"OK":"À corriger"}</strong></div>`;
    document.getElementById("etat").innerHTML=
      li(d.feuille,"Feuille Google (enregistrement des réponses)")+li(d.drive,"Dossier Drive (signatures et PDF)")+
      li(d.courriel,"Envoi de courriels"+(d.courriels_restants!=null?" — "+d.courriels_restants+" envois restants aujourd'hui":""))+
      li(d.url_formulaire,"Adresse de la page dans Code.gs (URL_FORMULAIRE)")+li(d.cle_admin,"Clé d'administration (CLE_ADMIN)");
  }).catch(()=>{document.getElementById("etat").innerHTML=`<p style="margin:0;color:var(--alert)">Vérification impossible.</p>`;});
  document.getElementById("testMail").onclick=async()=>{
    const b=document.getElementById("testMail");b.disabled=true;setStatus("Envoi du test…");
    try{
      const r=await apiPost({action:"testCourriel",cle:KEY});
      if(!r.ok)throw new Error(r.erreur||"Erreur inconnue.");
      setStatus(`Courriel de test envoyé à ${r.destinataires} administrateur${r.destinataires>1?"s":""}. Vérifiez la boîte de réception (et les courriers indésirables).`,"ok");
    }catch(err){setStatus(err.message,"err");}
    b.disabled=false;
  };
  app.addEventListener("change",async e=>{
    const cb=e.target.closest("input[data-role]");if(!cb)return;
    cb.disabled=true;setStatus("Enregistrement…");
    try{
      const r=await apiPost({action:"gestionMaj",cle:KEY,role:cb.dataset.role,courriel:cb.dataset.c,actif:cb.checked});
      if(!r.ok)throw new Error(r.erreur||"Erreur inconnue.");
      cb.closest(".tog").classList.toggle("off",!cb.checked);
      setStatus("Enregistré.","ok");
    }catch(err){cb.checked=!cb.checked;setStatus(err.message,"err");}
    cb.disabled=false;
  });
}

/* ---------- Page administrateur : désigner l'évaluateur ---------- */
function lienBloc(lien){
  if(!lien)return "";
  return `<div class="lienbox"><label class="f">Lien personnel de l'évaluateur<input type="text" id="lienEv" readonly value="${esc(lien)}"></label><div class="actions" style="margin-top:8px"><button class="btn" type="button" id="copyLien">Copier le lien</button><a class="btn ghost" href="${esc(lien)}" target="_blank" rel="noopener" style="text-decoration:none">Ouvrir</a></div></div>`;
}
function bindCopy(){
  const b=document.getElementById("copyLien");if(!b)return;
  b.onclick=async()=>{
    const i=document.getElementById("lienEv");
    try{await navigator.clipboard.writeText(i.value);}catch(e){i.select();try{document.execCommand("copy");}catch(_){}}
    b.textContent="Lien copié ✓";setTimeout(()=>{b.textContent="Copier le lien";},2500);
  };
}
async function initAdmin(){
  document.getElementById("roleTag").textContent="Désignation de l'évaluateur";
  if(!apiReady()){app.innerHTML=`<div class="banner">Le service n'est pas configuré (CONFIG.API_URL).</div>`;return;}
  try{
    const res=await apiGet({action:"obtenirAdmin",id:EID,a:ADM});
    if(!res.ok)throw new Error(res.erreur);
    if(res.complete){app.innerHTML=`<section class="sheet done"><h2>Évaluation déjà complétée</h2><p>Le rapport final a déjà été envoyé. Il n'y a plus rien à assigner.</p></section>`;return;}
    const e=res.evaluation;
    const lst=await apiGet({action:"evaluateurs"});
    document.getElementById("yr").textContent=e.identite.annee;
    app.innerHTML=`<section class="sheet"><div class="ident">
      <div class="f"><label class="f">Employé</label><span class="ro">${esc(e.identite.nom)}</span></div>
      <div class="f"><label class="f">Poste</label><span class="ro">${esc(e.identite.poste)}</span></div>
      <div class="f"><label class="f">Année évaluée</label><span class="ro">${esc(e.identite.annee)}</span></div>
      <div class="f"><label class="f">Autoévaluation signée le</label><span class="ro">${esc(e.date_signature)}</span></div></div></section>
      <section class="sheet intro"><h3 style="font-size:1.4rem;margin-bottom:8px">Désigner l'évaluateur</h3>
      <p>Choisissez la personne qui évaluera cet employé. Son lien personnel s'affichera ici : copiez-le et transmettez-le vous-même. Aucun courriel n'est envoyé à l'évaluateur.</p>
      ${e.evaluateur?`<p><strong>Évaluateur actuel : ${esc(e.evaluateur)}.</strong> Si vous en désignez un autre, le lien précédent cessera de fonctionner.</p>${lienBloc(e.lien_evaluateur)}`:""}
      <label class="f" style="max-width:420px">Évaluateur *<select id="evSel"><option value="">Choisir…</option>${(lst.evaluateurs||[]).map(n=>`<option${n===e.evaluateur?" selected":""}>${esc(n)}</option>`).join("")}</select></label>
      <div class="actions"><button class="btn" type="button" id="assign">${e.evaluateur?"Changer l'évaluateur (nouveau lien)":"Désigner l'évaluateur"}</button><span class="status" id="status" aria-live="polite"></span></div></section>
      <div class="actions"><button class="btn ghost" type="button" id="gest">Gestion des destinataires (admin)</button></div>`;
    bindCopy();
    document.getElementById("gest").onclick=()=>{const k=window.prompt("Clé d'administration :");if(k)location.href=location.pathname+"?admin="+encodeURIComponent(k.trim());};
    document.getElementById("assign").onclick=async()=>{
      const v=document.getElementById("evSel").value;
      if(!v){setStatus("Choisissez un évaluateur.","err");return;}
      const btn=document.getElementById("assign");btn.disabled=true;setStatus("Envoi en cours…");
      try{
        const r2=await apiPost({action:"assigner",id:EID,jeton_admin:ADM,evaluateur:v});
        if(!r2.ok)throw new Error(r2.erreur||"Erreur inconnue.");
        app.innerHTML=`<section class="sheet done"><h2>Évaluateur désigné : ${esc(v)}</h2><p>Aucun courriel n'a été envoyé à l'évaluateur. Copiez son lien personnel ci-dessous et transmettez-le-lui (il ne fonctionne qu'une fois).</p>${lienBloc(r2.lien)}<p>${r2.avis?"Les administrateurs ont reçu le même lien par courriel.":"L'avis par courriel aux administrateurs n'a pas pu être envoyé, mais ce lien est valide."} Vous pouvez rouvrir votre lien d'assignation pour le retrouver ou changer d'évaluateur tant que l'évaluation n'est pas signée.</p></section>`;bindCopy();
        window.scrollTo({top:0});
      }catch(err){setStatus("L'envoi a échoué : "+err.message,"err");btn.disabled=false;}
    };
  }catch(err){app.innerHTML=`<div class="banner">Impossible de charger la page : ${esc(err.message)}</div>`;}
}

(async function init(){
  if(KEY){await initGestion();return;}
  if(EID&&ADM&&!TOK){await initAdmin();return;}
  loadDraft();
  if(MODE==="emp"){
    document.getElementById("yr").textContent=state.t.annee||CONFIG.ANNEE_DEFAUT;
    build();
    if(apiReady()){
      apiGet({action:"ping"}).then(r=>{
        if(r&&r.ok)return;
        throw (r&&/Action inconnue/i.test(r.erreur||""))?svcError("old"):new Error((r&&r.erreur)||MSG_SERVICE);
      }).catch(err=>{
        app.insertAdjacentHTML("afterbegin",`<div class="banner"><strong>Le service d'envoi ne répond pas.</strong> ${esc(err.message)} <a href="${esc(CONFIG.API_URL)}?action=ping" target="_blank" rel="noopener">Tester l'adresse du service</a> (doit afficher « Le service fonctionne. »)</div>`);});
    }
    return;
  }else{
    document.getElementById("roleTag").textContent="Évaluation de l'évaluateur";
    if(!apiReady()){app.innerHTML=`<div class="banner">Le service n'est pas configuré (CONFIG.API_URL).</div>`;return;}
    try{
      const res=await apiGet({action:"obtenir",id:EID,t:TOK});
      if(!res.ok)throw new Error(res.erreur);
      if(res.complete){app.innerHTML=`<section class="sheet done"><h2>Évaluation déjà complétée</h2><p>Le rapport final de cette évaluation a déjà été envoyé. Communiquez avec les ressources humaines pour toute modification.</p></section>`;return;}
      EVAL=res.evaluation;
      document.getElementById("yr").textContent=EVAL.identite.annee;
      build();
    }catch(err){app.innerHTML=`<div class="banner">Impossible de charger l'évaluation : ${esc(err.message)}</div>`;}
  }
})();
</script>
